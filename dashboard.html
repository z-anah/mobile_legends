<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: "Lexend", sans-serif;
            background: #08111d;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        .card {
            transition: .25s;
        }

        .card:hover {
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

    <div id="app" class="min-h-screen">

        <!-- Header -->
        <div
            class="sticky top-0 z-50 backdrop-blur-xl bg-slate-950/80 border-b border-slate-800 px-5 py-4 flex justify-between items-center">

            <div>
                <h1 class="text-white text-2xl font-bold">
                    MLBB Dashboard
                </h1>

                <p class="text-slate-400 text-sm">
                    Maniac Difficulty Guide
                </p>
            </div>

            <a href="index.html"
                class="bg-emerald-500 hover:bg-emerald-400 text-white px-5 py-2 rounded-full font-semibold">
                Guide
            </a>

        </div>

        <!-- Top 5 -->
        <div class="p-5">

            <div class="bg-gradient-to-r from-yellow-500 to-amber-400 rounded-3xl p-6 shadow-xl">

                <h2 class="text-2xl font-bold text-black">
                    🏆 Top 5 les plus faciles pour obtenir un Maniac
                </h2>

                <div class="grid grid-cols-1 md:grid-cols-5 gap-3 mt-5">

                    <div v-for="(hero,index) in top5"
                        class="bg-white rounded-2xl p-5 text-center shadow font-semibold">

                        <div class="text-3xl">
                            {{index+1}}
                        </div>

                        <div class="mt-2 text-lg">
                            {{hero}}
                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- Categories -->

        <div class="px-5 pb-10">

            <div v-for="category in categories" class="mb-10">

                <div class="flex items-center gap-3 mb-5">

                    <div class="text-3xl">
                        {{category.stars}}
                    </div>

                    <div>

                        <h2 class="text-white text-2xl font-bold">
                            {{category.title}}
                        </h2>

                    </div>

                </div>

                <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-5">

                    <div v-for="hero in category.heroes"
                        class="card bg-slate-900 border border-slate-700 rounded-3xl p-6 shadow-xl">

                        <div class="flex justify-between items-center">

                            <h3 class="text-xl text-white font-bold">
                                {{hero.name}}
                            </h3>

                            <span
                                class="bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold">
                                Maniac
                            </span>

                        </div>

                        <div class="mt-6 space-y-3">

                            <div v-for="(step,index) in hero.steps"
                                class="flex gap-3 bg-slate-800 rounded-2xl p-4">

                                <div
                                    class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center text-white font-bold shrink-0">

                                    {{index+1}}

                                </div>

                                <div class="text-slate-200 leading-relaxed">
                                    {{step}}
                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="dashboard.js"></script>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <script>
        Vue.createApp({

            data() {

                return {

                    categories: window.dashboardData.categories,

                    top5: window.dashboardData.top5

                }

            }

        }).mount("#app");
    </script>

</body>

</html>
